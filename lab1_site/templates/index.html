<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Признаки</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
    <div class="site-header">
        <div class="header-left">
            <img src="http://127.0.0.1:9000/manuscripts/british-museum-logo.svg" alt="Логотип" class="logo">
        </div>
        <div class="header-right">
            <form method="POST" action="/" id="search-form">
                <input type="text" class="search-input" name="search" placeholder="Поиск..." id="search-input">
            </form>
            <a href="/order">
                <img src="http://127.0.0.1:9000/manuscripts/icons8-матрешка-48.png" alt="Матрешка" class="icon-matreshka">
            </a>
        </div>
    </div>
    <h1>Список признаков</h1>
    <div class="grid">
        {{range .}}
        <div class="card">
    <div class="card-left">
        <h3 class="card-title">{{.Name}}</h3>
        <p class="card-text">{{.Description}}</p>
        <div class="card-actions">
            <a href="/feature/?id={{.ID}}" class="card-detail">Подробнее</a>
            
            <form method="POST" action="/">
                <input type="hidden" name="id" value="{{.ID}}">
                <button type="submit" class="card-add">Добавить</button>
            </form>
        </div>
        

    </div>
    <div class="card-right">
        <img src="{{.ImageURL}}" alt="{{.Name}}">
    </div>
</div>

        {{end}}
    </div>
    
</body>
</html>
