<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Рукопись</title>
    <link rel="stylesheet" href="/resources/styles/common.css">
    <link rel="stylesheet" href="/resources/styles/order.css">
</head>
<body>
    <!-- Хедер -->
    <div class="site-header">
        <div class="header-left">
            <img src="http://127.0.0.1:9000/manuscripts/british-museum-logo.svg" alt="Логотип" class="logo">
        </div>
    </div>

    <!-- Заголовок и кнопка "Назад" -->
    <div class="title-row">
        <h1>Ваша рукопись</h1>
        <div class="title-controls">
            <a href="/">
                <img src="http://127.0.0.1:9000/manuscripts/icons8-назад-64.png" alt="Назад" class="icon-back">
            </a>
        </div>
    </div>

    <!-- Контейнер -->
    <div class="order-container">
        {{if .Signs}}
            {{range .Signs}}
            <div class="order-card">
                <div class="order-info">
                    <img src="{{.ImageURL}}" alt="{{.Name}}">
                    <div class="order-text">
                        <h3>{{.Name}}</h3>
                        <p>{{.Description}}</p>
                    </div>
                </div>
                <div class="count-form">
                    Количество: {{.Count}}
                </div>
            </div>
            {{end}}
        {{else}}
            <div class="order-empty" style="width: 1400px; padding: 20px; color: #B6BCBF;">
                Рукопись пуста
            </div>
        {{end}}
    </div>

    <!-- Итоговое количество -->
    <div class="order-total">
        <p>Общее количество: <strong>{{.TotalCount}}</strong></p>
    </div>
</body>
</html>
